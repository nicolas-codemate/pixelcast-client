# see https://symfony.com/doc/current/http_client.html
framework:
    http_client:
        default_options:
            timeout: 2
            max_redirects: 3
            headers:
                Accept: application/json

        scoped_clients:
            device.client:
                base_uri: '%env(PIXELCAST_DEVICE_BASE_URL)%'
                timeout: 2
                headers:
                    Accept: application/json

            weather.client:
                base_uri: 'https://api.open-meteo.com/v1/'
                timeout: 5
                headers:
                    Accept: application/json
                retry_failed:
                    max_retries: 2
