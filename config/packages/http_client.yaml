framework:
    http_client:
        default_options:
            timeout: 2
            max_redirects: 3
            headers:
                Accept: application/json

        scoped_clients:
            device.client:
                # Trailing slash required: without it, resolving a relative path against
                # the base URI drops its last segment and the /api prefix with it.
                base_uri: '%env(PIXELCAST_DEVICE_BASE_URL)%/'
                max_duration: 3

            weather.client:
                base_uri: 'https://api.open-meteo.com/v1/'
                timeout: 5
                retry_failed:
                    max_retries: 2

            coingecko.client:
                base_uri: 'https://api.coingecko.com/api/v3/'
                timeout: 5
                retry_failed:
                    max_retries: 2

            twelvedata.client:
                base_uri: 'https://api.twelvedata.com/'
                timeout: 5
                retry_failed:
                    max_retries: 2
                    # 429 is left out on purpose: retrying a rate-limited call spends credits
                    # the daily quota no longer has, and each retry bills one credit per symbol.
                    http_codes: [0, 500, 502, 503, 504, 507, 510]

            claude_oauth.client:
                # Trailing slash required: without it, resolving a relative path against the
                # base URI drops its last segment and the /oauth prefix with it.
                base_uri: 'https://platform.claude.com/v1/oauth/'
                timeout: 5
                retry_failed:
                    max_retries: 2
                    # Every 4xx is left out on purpose, 429 first of all: this endpoint rate-limits
                    # the exchange itself and sends no Retry-After, so a retry extends the lockout
                    # instead of recovering from it. Retrying a refresh grant that came back
                    # invalid_grant is worse still - the second attempt sends a token the server
                    # has already burned.
                    http_codes: [0, 500, 502, 503, 504, 507, 510]

            claude_usage.client:
                # Trailing slash required: without it, resolving a relative path against the
                # base URI drops its last segment and the /oauth prefix with it.
                base_uri: 'https://api.anthropic.com/api/oauth/'
                timeout: 5
                retry_failed:
                    max_retries: 2
                    # Every 4xx is left out on purpose, 401/403/429 first of all: this is an
                    # undocumented internal endpoint, and hammering it once it has refused a call
                    # is the surest way to lose access to it.
                    http_codes: [0, 500, 502, 503, 504, 507, 510]

            boursorama.client:
                base_uri: 'https://www.boursorama.com/'
                timeout: 5
                max_duration: 10
                retry_failed:
                    max_retries: 2
                    # 423, 425 and 429 are left out on purpose: this is an internal endpoint called
                    # once per asset, and retrying after a throttling is the surest way to lose access.
                    http_codes: [0, 500, 502, 503, 504, 507, 510]
