# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.simulator.default_state_file: '%kernel.project_dir%/var/simulator/state-%kernel.environment%.json'
    app.simulator.state_file: '%env(default:app.simulator.default_state_file:PIXELCAST_SIMULATOR_STATE_FILE)%'
    # Deliberately outside var/: prod persists only var/share, so a pair written under var/
    # would live in the container's own write layer and vanish on the next `up -d` after a
    # pull, costing a browser re-login. This path is the directory the prod compose file
    # bind-mounts, so the default lands in the mount even when the env var is left unset.
    app.claude.default_credentials_file: '%kernel.project_dir%/claude/credentials.json'
    app.claude.credentials_file: '%env(default:app.claude.default_credentials_file:PIXELCAST_CLAUDE_CREDENTIALS_FILE)%'
    app.tracker.default_all_time_high_database: '%kernel.share_dir%/tracker-all-time-high.sqlite'
    app.tracker.all_time_high_database: '%env(default:app.tracker.default_all_time_high_database:PIXELCAST_TRACKER_ALL_TIME_HIGH_DATABASE)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Simulator\State\ResettableState:
            tags: ['app.simulator_state']

        App\Provider\Tracker\TrackerProviderInterface:
            tags: ['app.tracker_provider']

        App\Tracker\History\AllTimeHighSourceInterface:
            tags: ['app.tracker_all_time_high_source']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    Nyholm\Psr7\Factory\Psr17Factory: ~

    Psr\Http\Message\ServerRequestFactoryInterface: '@Nyholm\Psr7\Factory\Psr17Factory'
    Psr\Http\Message\StreamFactoryInterface: '@Nyholm\Psr7\Factory\Psr17Factory'
    Psr\Http\Message\UploadedFileFactoryInterface: '@Nyholm\Psr7\Factory\Psr17Factory'
    Psr\Http\Message\ResponseFactoryInterface: '@Nyholm\Psr7\Factory\Psr17Factory'

    Symfony\Bridge\PsrHttpMessage\Factory\PsrHttpFactory: ~

    App\Simulator\Validation\OpenApiValidatorFactory: ~

    League\OpenAPIValidation\PSR7\ServerRequestValidator:
        factory: ['@App\Simulator\Validation\OpenApiValidatorFactory', 'create']
        arguments:
            $specPath: '%kernel.project_dir%/sync/openapi.yaml'

    App\Scenario\Validation\OutboundOpenApiValidatorFactory: ~

    league_openapi_psr7_validator.outbound_request_validator:
        class: League\OpenAPIValidation\PSR7\RequestValidator
        factory: ['@App\Scenario\Validation\OutboundOpenApiValidatorFactory', 'create']

    App\Scenario\Validation\OutboundPayloadValidator:
        arguments:
            $validator: '@league_openapi_psr7_validator.outbound_request_validator'

    App\Scenario\Transport\ScenarioHttpClient: ~

    App\Scenario\Transport\ScenarioTransport: '@App\Scenario\Transport\ScenarioHttpClient'

    App\Client\Inspector\InspectorHttpClient: ~

    App\Client\Inspector\InspectorTransport: '@App\Client\Inspector\InspectorHttpClient'

    App\Client\PixelcastClientInterface: '@App\Client\PixelcastClient'

    App\Provider\Weather\WeatherProviderInterface: '@App\Provider\Weather\OpenMeteoWeatherProvider'

    App\Provider\Claude\ClaudeUsageProviderInterface: '@App\Provider\Claude\ClaudeUsageProvider'

    App\Provider\GitHub\GitHubPullRequestProviderInterface: '@App\Provider\GitHub\GitHubPullRequestProvider'

    App\Claude\ClaudeCredentialsStore:
        arguments:
            $credentialsFilePath: '%app.claude.credentials_file%'

    App\Tracker\AllTimeHighStore:
        arguments:
            $databaseFilePath: '%app.tracker.all_time_high_database%'

    App\Provider\Tracker\CoinGeckoTrackerProvider:
        arguments:
            $apiKey: '%env(default::PIXELCAST_COINGECKO_API_KEY)%'

    App\Provider\Tracker\CoinGeckoMidnightPriceProvider:
        arguments:
            $apiKey: '%env(default::PIXELCAST_COINGECKO_API_KEY)%'

    App\Provider\Tracker\CoinGeckoVolumeSeriesProvider:
        arguments:
            $apiKey: '%env(default::PIXELCAST_COINGECKO_API_KEY)%'

    App\Provider\Tracker\TwelveDataTrackerProvider:
        arguments:
            $apiKey: '%env(default::PIXELCAST_TWELVEDATA_API_KEY)%'

    App\Provider\GitHub\GitHubPullRequestProvider:
        arguments:
            $token: '%env(default::PIXELCAST_GITHUB_TOKEN)%'

    App\Scheduler\SyncMessageRegistry: '@App\Schedule'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
