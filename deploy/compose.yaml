services:
  php:
    image: ghcr.io/nicolas-codemate/pixelcast-client:latest
    restart: unless-stopped
    # 30 MB per container, about five months of cycles even when every one of them fails.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ./pixelcast.env
    volumes:
      - ./pixelcast.yaml:/app/pixelcast.yaml:ro
      # Only the app cache pool, which carries the scheduler state, is kept.
      # Persisting all of var/ would also freeze the compiled container, which
      # prod reuses unchecked, so a pulled image would run new code against it.
      - pixelcast_var:/app/var/share

volumes:
  pixelcast_var:
