# Sample configuration used by TwelveDataTrackerProviderTest: the only Twelve Data item
# carrying the optional display fields, so the bottom text this provider never derives on
# its own still reaches the payload.
syncs:
    twelvedata:
        enabled: true
        interval: '15 minutes'
        items:
            - symbol: AAPL
              currency: usd
              icon: stock
              label: Apple
              labelColor: '#4CAF50'
              bottomText: Nasdaq
