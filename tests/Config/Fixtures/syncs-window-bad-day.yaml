# Sample configuration used by SyncsConfigLoaderTest: a window declaring a day that does not exist.
syncs:
    boursorama:
        enabled: true
        interval: '15 minutes'
        activeWindow:
            days: [mon, funday]
            from: '09:00'
            to: '17:45'
            timezone: Europe/Paris
        items:
            - symbol: 1rTDCAM
              currency: eur
