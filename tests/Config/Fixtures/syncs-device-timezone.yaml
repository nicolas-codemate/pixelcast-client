# Sample configuration used by SyncsConfigLoaderTest: the device names its timezone once, and
# neither the sleep schedule nor any active window repeats it. Every sync group declares an
# active window so a group that forgets to propagate the device timezone fails the test.
device:
    timezone: Europe/Paris

syncs:
    weather:
        enabled: true
        interval: '30 minutes'
        latitude: 48.8566
        longitude: 2.3522
        units: metric
        locale: fr
        activeWindow:
            days: [mon, tue, wed, thu, fri]
            from: '09:00'
            to: '17:45'

    coingecko:
        enabled: true
        interval: '5 minutes'
        activeWindow:
            days: [mon, tue, wed, thu, fri]
            from: '09:00'
            to: '17:45'
        items:
            - symbol: bitcoin
              currency: eur

    twelvedata:
        enabled: true
        interval: '15 minutes'
        activeWindow:
            days: [mon, tue, wed, thu, fri]
            from: '09:00'
            to: '17:45'
        items:
            - symbol: AAPL
              currency: usd

    boursorama:
        enabled: true
        interval: '15 minutes'
        activeWindow:
            days: [mon, tue, wed, thu, fri]
            from: '09:00'
            to: '17:45'
        items:
            - symbol: 1rTDCAM
              currency: eur
              activeWindow:
                  days: [mon, tue, wed, thu, fri]
                  from: '09:00'
                  to: '17:30'

    claude:
        enabled: true
        interval: '10 minutes'
        activeWindow:
            days: [mon, tue, wed, thu, fri]
            from: '09:00'
            to: '17:45'

    github:
        enabled: true
        interval: '10 minutes'
        query: 'is:open is:pr review-requested:@me'
        label: 'PR'
        activeWindow:
            days: [mon, tue, wed, thu, fri]
            from: '09:00'
            to: '17:45'

sleep:
    enabled: true
    windows:
        - from: '00:00'
          to: '07:00'
