# Sample configuration used by SyncsConfigLoaderTest: the device names its timezone once, and
# neither the sleep schedule nor the active window repeats it.
device:
    timezone: Europe/Paris

syncs:
    weather:
        enabled: true
        interval: '30 minutes'
        latitude: 48.8566
        longitude: 2.3522
        units: metric
        locale: fr

    boursorama:
        enabled: true
        interval: '15 minutes'
        activeWindow:
            days: [mon, tue, wed, thu, fri]
            from: '09:00'
            to: '17:45'
        items:
            - symbol: 1rTDCAM
              currency: eur
              activeWindow:
                  days: [mon, tue, wed, thu, fri]
                  from: '09:00'
                  to: '17:30'

sleep:
    enabled: true
    windows:
        - from: '00:00'
          to: '07:00'
