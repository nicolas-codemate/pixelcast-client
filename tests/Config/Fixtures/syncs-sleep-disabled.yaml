# Sample configuration used by SyncsConfigLoaderTest and ScheduleTest: a sleep section covering the
# night but switched off, which must leave the cycles strictly unchanged and needs no timezone.
syncs:
    weather:
        enabled: true
        interval: '30 minutes'
        latitude: 48.8566
        longitude: 2.3522
        units: metric
        locale: fr

sleep:
    enabled: false
    windows:
        - from: '00:00'
          to: '07:00'
