# Sample configuration used by ScheduleTest and SleepingGroupCyclesTest: a group open only during
# market hours, next to a group without any window, both under a sleep schedule covering the night.
syncs:
    weather:
        enabled: true
        interval: '30 minutes'
        latitude: 48.8566
        longitude: 2.3522
        units: metric
        locale: fr

    boursorama:
        enabled: true
        interval: '15 minutes'
        activeWindow:
            days: [mon, tue, wed, thu, fri]
            from: '09:00'
            to: '17:45'
            timezone: Europe/Paris
        items:
            - symbol: 1rTDCAM
              currency: eur

sleep:
    enabled: true
    timezone: Europe/Paris
    windows:
        - from: '00:00'
          to: '07:00'
