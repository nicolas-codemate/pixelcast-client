# Sample configuration used by ScheduleTest: two enabled groups of different sync types.
syncs:
    weather:
        enabled: true
        interval: '30 minutes'
        latitude: 48.8566
        longitude: 2.3522
        units: metric
        locale: fr

    coingecko:
        enabled: true
        interval: '5 minutes'
        items:
            - symbol: bitcoin
              currency: eur

    twelvedata:
        enabled: false
        interval: '15 minutes'
        items:
            - symbol: AAPL
              currency: usd
