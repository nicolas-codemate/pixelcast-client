# Sample configuration used by SyncsConfigLoaderTest: the sleep schedule and the active window both
# declare their own timezone, which wins over the one of the device.
device:
    timezone: Europe/Paris

syncs:
    weather:
        enabled: true
        interval: '30 minutes'
        latitude: 48.8566
        longitude: 2.3522
        units: metric
        locale: fr

    boursorama:
        enabled: true
        interval: '15 minutes'
        activeWindow:
            days: [mon, tue, wed, thu, fri]
            from: '09:00'
            to: '17:45'
            timezone: America/New_York
        items:
            - symbol: 1rTDCAM
              currency: eur

sleep:
    enabled: true
    timezone: America/New_York
    windows:
        - from: '00:00'
          to: '07:00'
