# Sample configuration used by SyncsConfigLoaderTest: a sleep window opening and closing at the same minute.
syncs:
    weather:
        enabled: true
        interval: '30 minutes'
        latitude: 48.8566
        longitude: 2.3522
        units: metric
        locale: fr

sleep:
    enabled: true
    timezone: Europe/Paris
    windows:
        - from: '07:00'
          to: '07:00'
