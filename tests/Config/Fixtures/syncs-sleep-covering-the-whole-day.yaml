# Sample configuration used by SyncsConfigLoaderTest: two sleep windows tiling the whole day, which
# would leave the panel off for good.
syncs:
    weather:
        enabled: true
        interval: '30 minutes'
        latitude: 48.8566
        longitude: 2.3522
        units: metric
        locale: fr

sleep:
    enabled: true
    timezone: Europe/Paris
    windows:
        - from: '00:00'
          to: '12:00'
        - from: '12:00'
          to: '00:00'
