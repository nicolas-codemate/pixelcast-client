# Sample configuration used by SyncsConfigLoaderTest: an active window that says neither which
# timezone its bounds are written in, nor which timezone the device is set to.
syncs:
    boursorama:
        enabled: true
        interval: '15 minutes'
        activeWindow:
            from: '09:00'
            to: '17:45'
        items:
            - symbol: 1rTDCAM
              currency: eur
