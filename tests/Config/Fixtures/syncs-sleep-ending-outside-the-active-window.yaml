# Sample configuration used by SleepingGroupCyclesTest: a group whose hours are cut in two by the
# sleep window, which ends after the group has closed for the day.
syncs:
    boursorama:
        enabled: true
        interval: '15 minutes'
        activeWindow:
            from: '05:00'
            to: '07:30'
            timezone: Europe/Paris
        items:
            - symbol: 1rTDCAM
              currency: eur

sleep:
    enabled: true
    timezone: Europe/Paris
    windows:
        - from: '06:00'
          to: '08:00'
