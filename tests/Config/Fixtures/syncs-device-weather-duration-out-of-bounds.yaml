# Sample configuration used by SyncsConfigLoaderTest: a weather duration below the milliseconds the
# weather app needs to show its pages, which the schema refuses.
device:
    weatherDuration: 1000

syncs:
    weather:
        enabled: true
        interval: '30 minutes'
        latitude: 48.8566
        longitude: 2.3522
        units: metric
        locale: fr
